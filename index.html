<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Note Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        .welcome {
            color: cyan;
            font-size: 24px;
            margin: 20px 0;
        }
        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        .subjects {
            display: none;
            margin: 20px 0;
        }
        .subjects.show {
            display: block;
        }
        .subject-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .subject-btn {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
        }
        .subject-btn:hover {
            background-color: #0b7dda;
        }
        .content {
            display: none;
            margin: 20px 0;
        }
        .content.show {
            display: block;
        }
        img {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
        }
        a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #FF5722;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 10px 0;
        }
        a:hover {
            background-color: #e64a19;
        }
    </style>
</head>
<body>
    <h1>Study Note Hub</h1>
    <div class="welcome">Welcome to all dear students</div>
    
    <div class="options">
        <button onclick="showSubjects('9th')">9th</button>
        <button onclick="showSubjects('10th')">10th</button>
        <button onclick="showSubjects('11th')">11th</button>
        <button onclick="showSubjects('12th')">12th</button>
    </div>
    
    <!-- 9th Class Subjects -->
    <div id="9th-subjects" class="subjects">
        <h2>9th Class Subjects</h2>
        <div class="subject-list">
            <button class="subject-btn" onclick="showContent('9th-math')">Maths</button>
            <button class="subject-btn" onclick="showContent('9th-science')">Science</button>
            <button class="subject-btn" onclick="showContent('9th-english')">English</button>
            <button class="subject-btn" onclick="showContent('9th-hindi')">Hindi</button>
            <button class="subject-btn" onclick="showContent('9th-social')">Social Science</button>
            <button class="subject-btn" onclick="showContent('9th-computer')">Computer Science</button>
            <button class="subject-btn" onclick="showContent('9th-computer')">Sanskrit</button>
        </div>
    </div>
    
    <!-- 10th Class Subjects -->
    <div id="10th-subjects" class="subjects">
        <h2>10th Class Subjects</h2>
        <div class="subject-list">
            <button class="subject-btn" onclick="showContent('10th-math')">Maths</button>
            <button class="subject-btn" onclick="showContent('10th-science')">Science</button>
            <button class="subject-btn" onclick="showContent('10th-english')">English</button>
            <button class="subject-btn" onclick="showContent('10th-hindi')">Hindi</button>
            <button class="subject-btn" onclick="showContent('10th-social')">Social Science</button>
            <button class="subject-btn" onclick="showContent('10th-computer')">Computer Science</button>
            <button class="subject-btn" onclick="showContent('9th-computer')">Sanskrit</button>
        </div>
    </div>
    
    <!-- 11th Class Subjects -->
    <div id="11th-subjects" class="subjects">
        <h2>11th Class Subjects</h2>
        <div class="subject-list">
            <button class="subject-btn" onclick="showContent('11th-physics')">Physics</button>
            <button class="subject-btn" onclick="showContent('11th-chemistry')">Chemistry</button>
            <button class="subject-btn" onclick="showContent('11th-math')">Maths</button>
            <button class="subject-btn" onclick="showContent('11th-biology')">Biology</button>
            <button class="subject-btn" onclick="showContent('11th-english')">English</button>
            <button class="subject-btn" onclick="showContent('9th-computer')">Computer Science</button>
            <button class="subject-btn" onclick="showContent('9th-computer')">Hindi</button>
        </div>
    </div>
    
    <!-- 12th Class Subjects -->
    <div id="12th-subjects" class="subjects">
        <h2>12th Class Subjects</h2>
        <div class="subject-list">
            <button class="subject-btn" onclick="showContent('12th-physics')">Physics</button>
            <button class="subject-btn" onclick="showContent('12th-chemistry')">Chemistry</button>
            <button class="subject-btn" onclick="showContent('12th-math')">Maths</button>
            <button class="subject-btn" onclick="showContent('12th-biology')">Biology</button>
            <button class="subject-btn" onclick="showContent('12th-english')">English</button>
            <button class="subject-btn" onclick="showContent('9th-computer')">Computer Science</button>
            <button class="subject-btn" onclick="showContent('9th-computer')">Computer Science</button>
        </div>
    </div>
    
    <!-- Content Sections -->
    <!-- 9th Maths -->
    <div id="9th-math" class="content">
        <h3>9th Maths Notes</h3>
        <img src="path/to/9th-math-image.jpg" alt="9th Maths Image"> <!-- Replace with your uploaded photo -->
        <a href="path/to/9th-math-notes.pdf" download>Download PDF</a> <!-- Replace with your PDF path -->
    </div>
    
    <!-- 9th Science -->
    <div id="9th-science" class="content">
        <h3>9th Science Notes</h3>
        <img src="path/to/9th-science-image.jpg" alt="9th Science Image">
        <a href="path/to/9th-science-notes.pdf" download>Download PDF</a>
    </div>
    
    <!-- Add similar divs for all other subjects in 9th, 10th, 11th, 12th -->
    <!-- For brevity, I'm showing only two examples. You need to add all. -->
    
    <!-- 10th Maths -->
    <div id="10th-math" class="content">
        <h3>10th Maths Notes</h3>
        <img src="path/to/10th-math-image.jpg" alt="10th Maths Image">
        <a href="path/to/10th-math-notes.pdf" download>Download PDF</a>
    </div>
    
    <!-- Continue for all subjects... -->
    
    <!-- 11th Physics -->
    <div id="11th-physics" class="content">
        <h3>11th Physics Notes</h3>
        <img src="path/to/11th-physics-image.jpg" alt="11th Physics Image">
        <a href="path/to/11th-physics-notes.pdf" download>Download PDF</a>
    </div>
    
    <!-- And so on for all subjects in 11th and 12th -->
    
    <script>
        function showSubjects(className) {
            // Hide all subjects
            const allSubjects = document.querySelectorAll('.subjects');
            allSubjects.forEach(sub => sub.classList.remove('show'));
            
            // Hide all content
            const allContent = document.querySelectorAll('.content');
            allContent.forEach(cont => cont.classList.remove('show'));
            
            // Show selected class subjects
            document.getElementById(className + '-subjects').classList.add('show');
        }
        
        function showContent(subjectId) {
            // Hide all content
            const allContent = document.querySelectorAll('.content');
            allContent.forEach(cont => cont.classList.remove('show'));
            
            // Show selected subject content
            document.getElementById(subjectId).classList.add('show');
        }
    </script>
</body>
</html>
